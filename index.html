<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StartOrigin - Anonymous Wall</title>
    
    <!-- PWA Assets & Apple App Capability -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#9333ea" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StartOrigin" />
    
    <!-- App Icons -->
    <link rel="icon" type="image/svg+xml" href="https://startorigin2.vercel.app/icon.svg" />
    <link rel="apple-touch-icon" href="https://startorigin2.vercel.app/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('Service worker registered successfully:', reg.scope);
            })
            .catch((err) => {
              console.warn('Service worker registration skipped/failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
